<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" role="img" aria-label="Expo floor plan">
  <defs>
    <linearGradient id="fp-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0e1830"/><stop offset="1" stop-color="#0a1020"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" fill="url(#fp-bg)"/>
  <rect x="24" y="24" width="1152" height="512" rx="10" fill="none" stroke="#33425f" stroke-width="2"/>

  <!-- Main stage -->
  <rect x="60" y="60" width="500" height="120" rx="8" fill="rgba(216,32,58,.16)" stroke="#d8203a" stroke-width="1.5"/>
  <text x="310" y="128" fill="#ffd9df" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">MAIN STAGE</text>

  <!-- Dent Masters arena -->
  <rect x="600" y="60" width="540" height="120" rx="8" fill="rgba(29,78,216,.16)" stroke="#3b62d8" stroke-width="1.5"/>
  <text x="870" y="128" fill="#cfe0ff" font-family="Arial, sans-serif" font-size="22" font-weight="700" text-anchor="middle" letter-spacing="2">DENT MASTERS ARENA</text>

  <!-- Booth grid -->
  <g fill="#16223c" stroke="#2c3b59" stroke-width="1.5">
    <!-- row labels via aisles; draw 4 rows x 12 booths -->
    <g>
      <rect x="60"  y="230" width="70" height="56" rx="4"/><rect x="142" y="230" width="70" height="56" rx="4"/><rect x="224" y="230" width="70" height="56" rx="4"/><rect x="306" y="230" width="70" height="56" rx="4"/><rect x="388" y="230" width="70" height="56" rx="4"/><rect x="470" y="230" width="70" height="56" rx="4"/>
      <rect x="660" y="230" width="70" height="56" rx="4"/><rect x="742" y="230" width="70" height="56" rx="4"/><rect x="824" y="230" width="70" height="56" rx="4"/><rect x="906" y="230" width="70" height="56" rx="4"/><rect x="988" y="230" width="70" height="56" rx="4"/><rect x="1070" y="230" width="70" height="56" rx="4"/>
    </g>
    <g>
      <rect x="60"  y="310" width="70" height="56" rx="4"/><rect x="142" y="310" width="70" height="56" rx="4"/><rect x="224" y="310" width="70" height="56" rx="4"/><rect x="306" y="310" width="70" height="56" rx="4"/><rect x="388" y="310" width="70" height="56" rx="4"/><rect x="470" y="310" width="70" height="56" rx="4"/>
      <rect x="660" y="310" width="70" height="56" rx="4"/><rect x="742" y="310" width="70" height="56" rx="4"/><rect x="824" y="310" width="70" height="56" rx="4"/><rect x="906" y="310" width="70" height="56" rx="4"/><rect x="988" y="310" width="70" height="56" rx="4"/><rect x="1070" y="310" width="70" height="56" rx="4"/>
    </g>
    <g>
      <rect x="60"  y="390" width="70" height="56" rx="4"/><rect x="142" y="390" width="70" height="56" rx="4"/><rect x="224" y="390" width="70" height="56" rx="4"/><rect x="306" y="390" width="70" height="56" rx="4"/><rect x="388" y="390" width="70" height="56" rx="4"/><rect x="470" y="390" width="70" height="56" rx="4"/>
      <rect x="660" y="390" width="70" height="56" rx="4"/><rect x="742" y="390" width="70" height="56" rx="4"/><rect x="824" y="390" width="70" height="56" rx="4"/><rect x="906" y="390" width="70" height="56" rx="4"/><rect x="988" y="390" width="70" height="56" rx="4"/><rect x="1070" y="390" width="70" height="56" rx="4"/>
    </g>
  </g>

  <!-- Center aisle label -->
  <text x="600" y="208" fill="#6b7690" font-family="Arial, sans-serif" font-size="13" text-anchor="middle" letter-spacing="2">EXHIBITOR BOOTHS</text>

  <!-- Entrance -->
  <rect x="520" y="470" width="160" height="46" rx="6" fill="rgba(34,197,94,.14)" stroke="#22c55e" stroke-width="1.5"/>
  <text x="600" y="500" fill="#bdf0cf" font-family="Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" letter-spacing="2">ENTRANCE</text>
</svg>
