<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="PAINT &amp; SURFACE"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c33"/><stop offset="1" stop-color="#070b15"/></linearGradient><radialGradient id="vig" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1b2c4d" stop-opacity="0.55"/><stop offset="1" stop-color="#070b15" stop-opacity="0"/></radialGradient><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a6b"/><stop offset="1" stop-color="#141d31"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a72"/><stop offset="1" stop-color="#b3162c"/></linearGradient><radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3651" stop-opacity="0.7"/><stop offset="1" stop-color="#ff3651" stop-opacity="0"/></radialGradient></defs><rect width="520" height="360" fill="url(#bg)"/><rect width="520" height="360" fill="url(#vig)"/>
  <!-- glossy panel -->
  <path d="M0 250 C160 180 360 180 520 250 L520 360 L0 360 Z" fill="url(#steel)"/>
  <path d="M0 250 C160 180 360 180 520 250" fill="none" stroke="#5a6c92" stroke-width="2"/>
  <!-- reflection streak -->
  <path d="M70 286 C200 250 330 250 460 286" fill="none" stroke="#9fb0cf" stroke-width="5" opacity="0.5" stroke-linecap="round"/>
  <!-- polisher -->
  <g>
    <ellipse cx="300" cy="232" rx="78" ry="26" fill="#0a0f1c"/>
    <ellipse cx="300" cy="230" rx="78" ry="26" fill="#0e1626" stroke="#46587e" stroke-width="2"/>
    <ellipse cx="300" cy="226" rx="70" ry="20" fill="url(#red)"/>
    <rect x="288" y="150" width="24" height="70" rx="10" fill="#1b2740" stroke="#46587e" stroke-width="2"/>
    <rect x="272" y="132" width="120" height="26" rx="13" fill="#26334f" stroke="#46587e" stroke-width="2"/>
  </g>
  <!-- motion arcs -->
  <g fill="none" stroke="#ff5a72" stroke-width="3" opacity="0.6" stroke-linecap="round">
    <path d="M214 248 a92 30 0 0 0 172 0"/>
    <path d="M232 264 a70 22 0 0 0 136 0" opacity="0.4"/>
  </g>
  <ellipse cx="300" cy="248" rx="120" ry="42" fill="url(#redglow)" opacity="0.4"/>
<text x="260.0" y="344" text-anchor="middle" fill="#7f8aa1" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">PAINT &amp; SURFACE</text></svg>