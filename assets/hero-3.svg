<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 360" preserveAspectRatio="xMidYMid slice" role="img" aria-label="SUMMIT STAGE"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c33"/><stop offset="1" stop-color="#070b15"/></linearGradient><radialGradient id="vig" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1b2c4d" stop-opacity="0.55"/><stop offset="1" stop-color="#070b15" stop-opacity="0"/></radialGradient><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a6b"/><stop offset="1" stop-color="#141d31"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a72"/><stop offset="1" stop-color="#b3162c"/></linearGradient><radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3651" stop-opacity="0.7"/><stop offset="1" stop-color="#ff3651" stop-opacity="0"/></radialGradient></defs><rect width="520" height="360" fill="url(#bg)"/><rect width="520" height="360" fill="url(#vig)"/>
