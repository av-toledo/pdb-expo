<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 240" preserveAspectRatio="xMidYMid slice" role="img" aria-label="SURFACE CARE"><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#101c33"/><stop offset="1" stop-color="#070b15"/></linearGradient><radialGradient id="vig" cx="50%" cy="38%" r="75%"><stop offset="0" stop-color="#1b2c4d" stop-opacity="0.55"/><stop offset="1" stop-color="#070b15" stop-opacity="0"/></radialGradient><linearGradient id="steel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3a4a6b"/><stop offset="1" stop-color="#141d31"/></linearGradient><linearGradient id="red" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5a72"/><stop offset="1" stop-color="#b3162c"/></linearGradient><radialGradient id="redglow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ff3651" stop-opacity="0.7"/><stop offset="1" stop-color="#ff3651" stop-opacity="0"/></radialGradient></defs><rect width="360" height="240" fill="url(#bg)"/><rect width="360" height="240" fill="url(#vig)"/>
  <!-- glossy surface -->
  <rect x="0" y="150" width="360" height="90" fill="url(#steel)"/>
  <path d="M0 150 H360" stroke="#5a6c92" stroke-width="2"/>
  <!-- beading droplet -->
  <path d="M150 150 a40 40 0 0 1 60 0 C214 120 196 92 180 78 C164 92 146 120 150 150 Z" fill="#1b2740" stroke="#5a6c92" stroke-width="2"/>
  <ellipse cx="168" cy="116" rx="10" ry="16" fill="#9fb0cf" opacity="0.7"/>
  <circle cx="196" cy="132" r="4" fill="#ffffff" opacity="0.8"/>
  <!-- small droplets -->
  <circle cx="96" cy="150" r="12" fill="#1b2740" stroke="#5a6c92" stroke-width="1.5"/>
  <circle cx="266" cy="150" r="16" fill="#1b2740" stroke="#5a6c92" stroke-width="1.5"/>
  <!-- sparkle -->
  <g stroke="#ff5a72" stroke-width="2" stroke-linecap="round">
    <path d="M230 70 v16 M222 78 h16"/></g>
  <ellipse cx="180" cy="150" rx="120" ry="34" fill="url(#redglow)" opacity="0.3"/>
<text x="180.0" y="224" text-anchor="middle" fill="#7f8aa1" font-family="Arial,sans-serif" font-size="13" font-weight="700" letter-spacing="2">SURFACE CARE</text></svg>